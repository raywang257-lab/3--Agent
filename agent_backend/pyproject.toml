[project]
name = "trendscope-agent"
version = "0.1.0"
description = "Independent multi-source hotspot discovery agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "feedparser>=6,<7",
  "openai>=1.100,<3",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "apscheduler>=3.11,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[tool.pyright]
pythonVersion = "3.11"
include = ["trendscope", "tests"]
